<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsplash API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    /* ── Top bar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    .toolbar span {
      font-weight: bold;
      font-size: 14px;
      margin-right: 4px;
    }
    #query {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 14px;
      width: 160px;
      outline: none;
    }
    #query:focus { border-color: #888; }

    .btn {
      padding: 5px 12px;
      font-size: 13px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #444;
      color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #222; }
    .btn:active { background: #000; }

    /* ── Status ── */
    #status {
      padding: 6px 16px;
      font-size: 13px;
      color: #666;
      min-height: 28px;
    }
    #status.error { color: #c00; }

    /* ── Gallery ── */
    #gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px 16px 40px;
    }

    .img-card {
      overflow: hidden;
      background: #f0f0f0;
      animation: fadeIn .4s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .img-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .3s;
    }
    .img-card:hover img { transform: scale(1.03); }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px;
      color: #aaa;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      #gallery { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <span>Unsplash API</span>
  <input id="query" type="text" value="Makkah" placeholder="Search…" />
  <button class="btn" onclick="searchXHR()">Search using XHR</button>
  <button class="btn" onclick="searchPromise()">Search using fetch (promises)</button>
  <button class="btn" onclick="searchAsync()">Search using fetch (async/await)</button>
</div>

<div id="status"></div>

<div id="gallery">
  <div class="empty">Enter a query and click a search button.</div>
</div>

<script>
  // ── PUT YOUR ACCESS KEY HERE ──────────────────────────────
  const ACCESS_KEY = '';
  // ─────────────────────────────────────────────────────────

  const PER_PAGE = 8;

  function buildURL(q) {
    return `https://api.unsplash.com/search/photos?query=${encodeURIComponent(q)}&per_page=${PER_PAGE}`;
  }

  function getQuery() {
    return document.getElementById('query').value.trim() || 'nature';
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function validate() {
    if (!ACCESS_KEY || ACCESS_KEY === 'YOUR_ACCESS_KEY_HERE') {
      setStatus('⚠ Please add your Unsplash Access Key in the code (ACCESS_KEY variable).', true);
      return false;
    }
    return true;
  }

  function renderImages(photos) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    if (!photos || photos.length === 0) {
      gallery.innerHTML = '<div class="empty">No results found.</div>';
      return;
    }

    photos.forEach((photo, i) => {
      const card = document.createElement('div');
      card.className = 'img-card';
      card.style.animationDelay = `${i * 0.04}s`;

      const img = document.createElement('img');
      img.src = photo.urls.small;
      img.alt = photo.alt_description || 'Unsplash photo';
      img.loading = 'lazy';

      card.appendChild(img);
      gallery.appendChild(card);
    });
  }

  // ── 1. XMLHttpRequest ─────────────────────────────────────
  function searchXHR() {
    if (!validate()) return;
    setStatus('Searching…');
    document.getElementById('gallery').innerHTML = '';

    const xhr = new XMLHttpRequest();
    xhr.open('GET', buildURL(getQuery()));
    xhr.setRequestHeader('Authorization', `Client-ID ${ACCESS_KEY}`);

    xhr.onload = function () {
      if (xhr.status === 200) {
        const data = JSON.parse(xhr.responseText);
        renderImages(data.results);
        setStatus(`Found ${data.results.length} results (XHR)`);
      } else {
        setStatus(`Error ${xhr.status}: ${xhr.statusText}`, true);
      }
    };

    xhr.onerror = () => setStatus('Network error (XHR)', true);
    xhr.send();
  }

  // ── 2. Fetch with Promises ────────────────────────────────
  function searchPromise() {
    if (!validate()) return;
    setStatus('Searching…');
    document.getElementById('gallery').innerHTML = '';

    fetch(buildURL(getQuery()), {
      headers: { Authorization: `Client-ID ${ACCESS_KEY}` }
    })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        renderImages(data.results);
        setStatus(`Found ${data.results.length} results (fetch + promises)`);
      })
      .catch(err => setStatus(`Error: ${err.message}`, true));
  }

  // ── 3. Fetch with Async/Await ─────────────────────────────
  async function searchAsync() {
    if (!validate()) return;
    setStatus('Searching…');
    document.getElementById('gallery').innerHTML = '';

    try {
      const res = await fetch(buildURL(getQuery()), {
        headers: { Authorization: `Client-ID ${ACCESS_KEY}` }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      renderImages(data.results);
      setStatus(`Found ${data.results.length} results (fetch + async/await)`);
    } catch (err) {
      setStatus(`Error: ${err.message}`, true);
    }
  }

  // Enter key triggers async search
  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchAsync();
  });
</script>
</body>
</html>
